services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: ["node", "main.js"]

  deploy-commands:
    build: .
    env_file:
      - .env
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    entrypoint: ["node", "src/scripts/deploy-commands.js"]

  test:
    build: .
    container_name: discord-bot-test
    env_file:
      - .env
    working_dir: /usr/src/app
    command: ["npm", "run", "test:ci"]

  mongodb:
    image: mongo:latest
    restart: always
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
      - ./init-mongo.d:/docker-entrypoint-initdb.d/:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root # <- Se carga desde .env
      MONGO_INITDB_ROOT_PASSWORD: example # <- Se carga desde .env
      MONGO_INITDB_DATABASE: devdb
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME} # <- Se carga desde .env
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD} # <- Se carga desde .env

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - my_network

  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    # environment:
    #   # - MONGO_URI=mongodb://apiUser:apiPassword@mongodb:27017/devdb?authSource=devdb
    #   - MONGO_URI=mongodb://root:example@mongodb:27017/devdb?authSource=admin
    #   - MONGO_AUTH_DB=admin
    #   - MONGO_DATABASE=devdb
    #   - SECRET_KEY=${SECRET_KEY}
    environment:
      # - MONGO_URI=mongodb+srv://root:example@mongodb:27017/
      - MONGO_URI=mongodb://root:example@mongodb:27017/?retryWrites=true&w=majority?tls=false
      # - MONGO_URI=mongodb://root:example@mongodb:27017/?retryWrites=true&w=majority
      # - MONGO_URI=mongodb+srv://root:example@mongodb:27017/?retryWrites=true&w=majority
      # - MONGO_URI=mongodb://apiUser:apiPassword@mongodb:27017/devdb?authSource=admin
      - MONGO_AUTH_DB=devdb
      - MONGO_DATABASE=devdb
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my_network

  db-client:
    image: mongo-express
    container_name: mongo-express
    restart: always
    volumes:
      - ./data:/data/
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - my_network

volumes:
  mongodb_data:

networks:
  my_network: