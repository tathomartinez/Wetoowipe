services:
  discord-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./bot:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs/discord-bot:/usr/src/app/logs
      - ./shared-files:/usr/src/app/shared-files:ro
      - ./tts-output:/usr/src/app/tts-output
    working_dir: /usr/src/app
    command: ["npx", "nodemon", "--watch", "src", "--ext", "ts", "--exec", "npx ts-node main.ts"]

  deploy-commands:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env
    working_dir: /usr/src/app
    volumes:
      - ./bot/src:/usr/src/app/src
      - ./bot/tsconfig.json:/usr/src/app/tsconfig.json
      - ./bot/package.json:/usr/src/app/package.json
    entrypoint: ["sh", "-c", "npm install && npx ts-node src/scripts/deploy-commands.ts"]

  test:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: discord-bot-test
    env_file:
      - .env
    working_dir: /usr/src/app
    command: ["npm", "run", "test:ci"]
    profiles:
      - debug

  mongodb:
    image: mongo:8.0.6
    restart: always
    container_name: mongodb
    volumes:
      - ./data:/data/db
      - ./init-mongo.d:/docker-entrypoint-initdb.d/:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - my_network

  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_AUTH_DB=${MONGO_DATABASE}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - SECRET_KEY=${SECRET_KEY}
      - API_TOKEN=${API_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - APP_ENV=${APP_ENV:-development}
      - APP_PORT=${APP_PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - my_network

  db-client:
    image: mongo-express
    container_name: mongo-express
    restart: always
    volumes:
      - ./data:/data/
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_URI}
      ME_CONFIG_BASICAUTH: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - my_network
    profiles:
      - debug

  f5-tts:
    build:
      context: ./Spanish-F5
      dockerfile: Dockerfile
    container_name: f5-tts
    ports:
      - "7860:7860"
    volumes:
      - ./logs/f5-tts:/workspace/F5-TTS/logs
      - ./f5-tts-cache:/root/.cache/huggingface/hub
      - ./shared-files:/workspace/shared-files:ro
      - ./training:/workspace/training
    environment:
      - PYTHONUNBUFFERED=1
      - CUSTOM_MODEL_PATH=/workspace/training/checkpoints/ejemplo/model_last.pt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - my_network
    command: ["sh", "-c", "pip install -q torch==2.5.1 torchaudio==2.5.1 torchvision==0.20.1 && bash /workspace/training/start_custom_tts.sh"]

  f5-tts-train:
    build:
      context: ./Spanish-F5
      dockerfile: Dockerfile
    volumes:
      - ./training:/workspace/training
      - ./training/checkpoints:/workspace/f5-tts/ckpts
      - ./f5-tts-cache:/root/.cache/huggingface/hub
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - my_network
    entrypoint: ["/workspace/training/entrypoint.sh"]

  file-server:
    image: nginx:latest
    container_name: file-server
    volumes:
      - ./shared-files:/usr/share/nginx/html:ro
    networks:
      - my_network

  cron-cleanup:
    image: alpine:latest
    container_name: cron-cleanup
    restart: unless-stopped
    volumes:
      - ./tts-output:/tts-output
    command: >
      sh -c "echo '0 * * * * find /tts-output -name \"*.wav\" -mmin +1440 -delete' | crontab - && crond -f"
    networks:
      - my_network

volumes:
  mongodb_data:

networks:
  my_network:
