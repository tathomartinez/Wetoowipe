services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - ./logs/discord-bot:/usr/src/app/logs
    working_dir: /usr/src/app
    command: ["node", "main.js"]
    networks:
      - my_network

  deploy-commands:
    build: .
    env_file:
      - .env
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    entrypoint: ["node", "src/scripts/deploy-commands.js"]

  test:
    build: .
    container_name: discord-bot-test
    env_file:
      - .env
    working_dir: /usr/src/app
    command: ["npm", "run", "test:ci"]

  mongodb:
    image: mongo:latest
    restart: always
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
      - ./init-mongo.d:/docker-entrypoint-initdb.d/:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - my_network

  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_AUTH_DB=${MONGO_DATABASE}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - SECRET_KEY=${SECRET_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - my_network

  db-client:
    image: mongo-express
    container_name: mongo-express
    restart: always
    volumes:
      - ./data:/data/
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_URI}
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - my_network
    profiles:
      - debug
  f5-tts:
    build:
      context: ./Spanish-F5
      dockerfile: Dockerfile
    container_name: f5-tts
    ports:
      - "7860:7860" # Puerto expuesto por F5-TTS
    volumes:
      # - ./F5-TTS:/workspace/F5-TTS # Montar la carpeta del proyecto
      - ./logs/f5-tts:/workspace/F5-TTS/logs # Montar la carpeta de logs
      - ./f5-tts-cache:/root/.cache/huggingface/hub
    environment:
      - PYTHONUNBUFFERED=1 # Evitar buffering en los logs de Python
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - my_network
    command: ["f5-tts_infer-gradio", "--host", "0.0.0.0"]

  file-server:
    image: nginx:latest
    container_name: file-server
    ports:
      - "8082:80" # Exponer el servidor en el puerto 8080
    volumes:
      - ./shared-files:/usr/share/nginx/html:ro # Montar la carpeta local como solo lectura
    networks:
      - my_network

volumes:
  mongodb_data:

networks:
  my_network:


